<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b4ee8">
<meta name="description" content="LEARN HUB - Learn useful things through simple tutorials.">
<title>LEARN HUB</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:background-color .25s ease,color .25s ease}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
:root{color-scheme:light;--bg:#f5f6fb;--card:#fff;--surface:#fff;--surface2:#f8f9fc;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--primary:#5b4ee8;--primary-dark:#493ed1;--primary2:#8438ed;--danger:#ff456d;--input:#fff;--hover:#f3f4f8;--scroll:#b7bcc7;--shadow:0 10px 35px rgba(0,0,0,.07)}
body.dark{color-scheme:dark;--bg:#080b12;--card:#111722;--surface:#111722;--surface2:#171d29;--text:#f5f7ff;--muted:#a5adbb;--border:#293241;--primary:#6758f0;--primary-dark:#5546dc;--primary2:#8b4cf0;--danger:#ff5b7c;--input:#111722;--hover:#1a2230;--scroll:#4d5868;--shadow:0 12px 40px rgba(0,0,0,.42)}
body.dark input,body.dark button{color-scheme:dark}
body.dark input::placeholder{color:#8993a3}
.header{position:sticky;top:0;z-index:1000;width:100%;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(15px,calc((100vw - 1200px)/2));background:rgba(255,255,255,.95);border-bottom:1px solid var(--border);backdrop-filter:blur(15px);transition:background-color .25s ease,border-color .25s ease}
body.dark .header{background:rgba(10,14,22,.95)}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);font-size:21px;font-weight:800}
.logo-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));font-size:18px;box-shadow:0 5px 15px rgba(91,78,232,.25)}
.theme-button{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:18px;transition:background .2s,border-color .2s,transform .2s}
.theme-button:hover{background:var(--hover);transform:translateY(-1px)}
.container{width:100%;max-width:1200px;margin:auto;padding:30px 18px 70px}
.hero{margin-bottom:26px;padding:40px;overflow:hidden;border-radius:25px;color:#fff;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.23),transparent 30%),linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 12px 35px rgba(91,78,232,.18)}
.hero h1{margin-bottom:12px;font-size:clamp(36px,7vw,55px);line-height:1;letter-spacing:-1.5px}
.hero p{font-size:16px;line-height:1.5;color:rgba(255,255,255,.94)}
.search-area{position:relative;z-index:500;margin-bottom:18px}
.search-row{display:flex;align-items:center;gap:10px}
.search-box{position:relative;flex:1}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
.search-input{width:100%;height:58px;padding:0 18px 0 50px;border:1px solid var(--border);border-radius:17px;outline:none;background:var(--input);color:var(--text);box-shadow:var(--shadow);font-size:16px;transition:background .25s,border-color .25s,color .25s,box-shadow .25s}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(103,88,240,.18)}
.filter-button{position:relative;flex-shrink:0;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:0;border-radius:17px;background:linear-gradient(135deg,#1683ee,#0878e8);color:#fff;font-size:23px;box-shadow:0 8px 20px rgba(0,120,240,.22)}
.filter-button.active{box-shadow:0 0 0 3px rgba(103,88,240,.25)}
.filter-count{position:absolute;right:-3px;top:-5px;min-width:20px;height:20px;display:none;align-items:center;justify-content:center;padding:0 5px;border-radius:20px;background:#ef4444;color:#fff;font-size:10px;font-weight:800}
.filter-count.show{display:flex}
.filter-menu{position:absolute;right:0;top:68px;width:260px;max-width:calc(100vw - 30px);height:390px;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:15px;background:var(--card);box-shadow:var(--shadow);transition:background .25s,border-color .25s}
.filter-menu.open{display:flex}
.filter-header{flex:0 0 auto;height:74px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--card);color:var(--text)}
.filter-header strong{display:block;margin-bottom:4px;font-size:15px}
.filter-header span{color:var(--muted);font-size:11px}
.filter-list{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.filter-list::-webkit-scrollbar{width:6px}
.filter-list::-webkit-scrollbar-track{background:transparent}
.filter-list::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:20px}
.filter-item{width:100%;height:54px;min-height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 15px;border:0;border-bottom:1px solid var(--border);background:var(--card);color:var(--text);text-align:left;font-size:14px;transition:background .15s,color .15s}
.filter-item:last-child{border-bottom:0}
.filter-item:hover{background:var(--hover)}
.filter-item.selected{background:var(--primary);color:#fff}
.filter-item-left{min-width:0;display:flex;align-items:center;gap:9px}
.filter-check{width:21px;flex-shrink:0;text-align:center;font-weight:800}
.favorite-filter{color:var(--danger)}
.filter-item.selected .favorite-filter{color:#fff}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 16px}
.section-header h2{color:var(--text);font-size:23px}
.section-count{color:var(--muted);font-size:13px}
.tutorial-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tutorial-card{overflow:hidden;border:1px solid var(--border);border-radius:19px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,background .25s,border-color .25s}
.tutorial-card:hover{transform:translateY(-3px)}
.thumbnail{position:relative;width:100%;height:175px;overflow:hidden;background:linear-gradient(135deg,#4f46e5,#9333ea)}
.thumbnail img{width:100%;height:100%;display:block;object-fit:cover}
.thumbnail-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px}
.play-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.68);color:#fff;font-size:19px;opacity:0;transition:.2s;pointer-events:none}
.tutorial-card:hover .play-overlay{opacity:1}
.category-badge{position:absolute;left:12px;bottom:12px;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:700;pointer-events:none}
.favorite-card-button{position:absolute;right:11px;top:11px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:20px;z-index:5}
.favorite-card-button.active{background:#fff;color:var(--danger)}
.tutorial-content{padding:17px;background:var(--card)}
.tutorial-title{margin-bottom:8px;color:var(--text);font-size:18px;line-height:1.35}
.tutorial-description{min-height:42px;color:var(--muted);font-size:14px;line-height:1.5}
.tutorial-meta{display:flex;flex-wrap:wrap;gap:10px;margin:13px 0;color:var(--muted);font-size:12px}
.watched-label{color:#22c55e;font-weight:700}
.watch-button{width:100%;padding:12px;border:0;border-radius:11px;background:var(--primary);color:#fff;font-weight:700}
.watch-button:hover{background:var(--primary-dark)}
.loading{grid-column:1/-1;min-height:180px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.spinner{width:21px;height:21px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state{grid-column:1/-1;padding:55px 20px;text-align:center;color:var(--muted)}
.state-icon{margin-bottom:12px;font-size:45px}
.state h3{margin-bottom:7px;color:var(--text)}
.retry-button{margin-top:16px;padding:11px 18px;border:0;border-radius:11px;background:var(--primary);color:#fff;font-weight:700}
#tutorialView{display:none}
.video-heading{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.back-button{flex-shrink:0;padding:10px 14px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);transition:background .2s}
.back-button:hover{background:var(--hover)}
.video-heading h2{color:var(--text);font-size:23px}
.video-heading p{margin-top:3px;color:var(--muted);font-size:13px}
.video-card{overflow:hidden;border:1px solid var(--border);border-radius:18px;background:var(--card);box-shadow:var(--shadow);transition:background .25s,border-color .25s}
.video-player{width:100%;aspect-ratio:16/9;background:#000}
.video-player iframe{width:100%;height:100%;display:block;border:0}
.video-info{padding:20px;background:var(--card)}
.video-info h2{margin-bottom:8px;color:var(--text);font-size:22px;line-height:1.4}
.video-info p{color:var(--muted);line-height:1.55}
.video-actions{display:flex;gap:9px;margin-top:18px}
.video-action{flex:1;padding:11px 14px;border:0;border-radius:11px;background:var(--primary);color:#fff;font-weight:700}
.video-action.favorite{background:var(--card);border:1px solid var(--border);color:var(--text)}
.video-action.favorite.active{color:var(--danger);border-color:rgba(255,69,109,.35)}
.toast{position:fixed;left:50%;bottom:22px;z-index:2000;max-width:calc(100vw - 30px);padding:12px 17px;border-radius:12px;background:#111827;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.30);opacity:0;pointer-events:none;transform:translate(-50%,120px);transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.dark{background:#080b12!important;color:#f5f7ff!important}
body.dark .tutorial-card,body.dark .tutorial-content,body.dark .video-card,body.dark .video-info,body.dark .filter-menu,body.dark .filter-header,body.dark .filter-item,body.dark .search-input,body.dark .theme-button,body.dark .back-button{background-color:#111722}
body.dark .filter-item:hover,body.dark .back-button:hover,body.dark .theme-button:hover{background-color:#1a2230}
body.dark .section-header h2,body.dark .tutorial-title,body.dark .video-heading h2,body.dark .video-info h2,body.dark .state h3,body.dark .logo{color:#f5f7ff}
body.dark .tutorial-description,body.dark .tutorial-meta,body.dark .section-count,body.dark .video-info p,body.dark .video-heading p,body.dark .filter-header span{color:#a5adbb}
@media(max-width:950px){.tutorial-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.header{height:62px;padding:0 14px}.logo{font-size:18px}.logo-icon{width:34px;height:34px}.container{padding:20px 13px 50px}.hero{padding:30px 22px;border-radius:21px}.hero h1{font-size:36px}.hero p{font-size:14px}.tutorial-grid{grid-template-columns:1fr}.thumbnail{height:190px}.filter-menu{right:0;width:260px;max-width:calc(100vw - 30px);height:390px;max-height:calc(100vh - 125px)}.filter-item{height:54px;min-height:54px}.video-heading{align-items:flex-start}.video-heading h2{font-size:19px}.video-actions{flex-wrap:wrap}.video-action{min-width:calc(50% - 5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="header">
<div class="logo"><div class="logo-icon">▶</div>LEARN HUB</div>
<button id="themeButton" class="theme-button" type="button" aria-label="Toggle dark mode">🌙</button>
</header>
<main class="container">
<section id="homeView">
<div class="hero">
<h1>LEARN HUB</h1>
<p>Learn useful things through simple tutorials.</p>
</div>
<div class="search-area">
<div class="search-row">
<div class="search-box">
<span class="search-icon">🔍</span>
<input id="searchInput" class="search-input" type="search" placeholder="Search tutorials..." autocomplete="off" aria-label="Search tutorials">
</div>
<button id="filterButton" class="filter-button" type="button" aria-label="Open category filter" aria-expanded="false">☰<span id="filterCount" class="filter-count"></span></button>
</div>
<div id="filterMenu" class="filter-menu">
<div class="filter-header">
<strong>Filter Tutorials</strong>
<span>Select a category</span>
</div>
<div id="filterList" class="filter-list"></div>
</div>
</div>
<div id="continueHeader" class="section-header hidden"><h2>Continue Watching</h2></div>
<div id="continueGrid" class="tutorial-grid"></div>
<div class="section-header">
<h2 id="sectionTitle">Tutorials</h2>
<span id="tutorialCount" class="section-count"></span>
</div>
<div id="tutorialGrid" class="tutorial-grid">
<div class="loading"><div class="spinner"></div>Loading tutorials...</div>
</div>
</section>
<section id="tutorialView">
<div class="video-heading">
<button id="backButton" class="back-button" type="button">← Back</button>
<div>
<h2 id="videoPageTitle">Tutorial</h2>
<p id="videoPageCategory">Tutorial</p>
</div>
</div>
<div class="video-card">
<div id="videoPlayer" class="video-player"></div>
<div class="video-info">
<h2 id="videoTitle">Tutorial</h2>
<p id="videoDescription"></p>
<div class="video-actions">
<button id="watchedButton" class="video-action" type="button">✓ Mark Watched</button>
<button id="favoriteButton" class="video-action favorite" type="button">♡ Favorite</button>
</div>
</div>
</div>
</section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const CONFIG={dataFile:"tutorials.json",favoritesKey:"learnhub_favorites_v6",watchedPrefix:"learnhub_watched_v6_",themeKey:"learnhub_theme_v6"};
const state={tutorials:[],currentTutorial:null,search:"",category:"All",filterOpen:false,toastTimer:null};
const DOM={home:document.getElementById("homeView"),tutorialView:document.getElementById("tutorialView"),tutorialGrid:document.getElementById("tutorialGrid"),continueGrid:document.getElementById("continueGrid"),continueHeader:document.getElementById("continueHeader"),sectionTitle:document.getElementById("sectionTitle"),tutorialCount:document.getElementById("tutorialCount"),search:document.getElementById("searchInput"),filterButton:document.getElementById("filterButton"),filterCount:document.getElementById("filterCount"),filterMenu:document.getElementById("filterMenu"),filterList:document.getElementById("filterList"),theme:document.getElementById("themeButton"),back:document.getElementById("backButton"),pageTitle:document.getElementById("videoPageTitle"),pageCategory:document.getElementById("videoPageCategory"),player:document.getElementById("videoPlayer"),title:document.getElementById("videoTitle"),description:document.getElementById("videoDescription"),watched:document.getElementById("watchedButton"),favorite:document.getElementById("favoriteButton"),toast:document.getElementById("toast")};
document.addEventListener("DOMContentLoaded",init);
async function init(){loadTheme();bindEvents();showLoading();await loadTutorials()}
function bindEvents(){
DOM.theme.addEventListener("click",toggleTheme);
DOM.back.addEventListener("click",showHome);
DOM.search.addEventListener("input",function(){state.search=this.value.trim().toLowerCase();renderHome()});
DOM.filterButton.addEventListener("click",function(event){event.stopPropagation();toggleFilter()});
DOM.filterMenu.addEventListener("click",function(event){event.stopPropagation()});
DOM.filterList.addEventListener("click",handleFilterClick);
DOM.tutorialGrid.addEventListener("click",handleTutorialClick);
DOM.continueGrid.addEventListener("click",handleTutorialClick);
DOM.watched.addEventListener("click",toggleWatched);
DOM.favorite.addEventListener("click",toggleCurrentFavorite);
document.addEventListener("click",closeFilter);
window.addEventListener("popstate",handleRoute);
}
async function loadTutorials(){
try{
const response=await fetch(CONFIG.dataFile,{cache:"no-cache"});
if(!response.ok)throw new Error("Could not load tutorials.json. HTTP "+response.status);
const data=await response.json();
validateData(data);
state.tutorials=normalizeTutorials(data.tutorials);
if(state.tutorials.length===0){showEmpty("No tutorials found","Add valid tutorials to tutorials.json.");return}
renderFilters();
renderHome();
handleRoute();
}catch(error){console.error("LEARN HUB ERROR:",error);showError(error)}
}
function validateData(data){
if(!data||typeof data!=="object")throw new Error("tutorials.json contains invalid data.");
if(!Array.isArray(data.tutorials))throw new Error('tutorials.json must contain a "tutorials" array.');
}
function normalizeTutorials(tutorials){
const result=[],ids=new Set();
tutorials.forEach(function(item,index){
try{
if(!item||typeof item!=="object")throw new Error("Invalid tutorial object.");
const id=String(item.id||"").trim();
const title=String(item.title||"").trim();
const category=String(item.category||"Other").trim();
const videoId=String(item.videoId||"").trim();
if(!id)throw new Error("Missing id.");
if(!title)throw new Error("Missing title.");
if(!videoId)throw new Error("Missing videoId.");
if(!isValidYouTubeId(videoId))throw new Error("Invalid YouTube videoId.");
if(ids.has(id))throw new Error("Duplicate id: "+id);
ids.add(id);
let keywords=[];
if(Array.isArray(item.keywords)){keywords=item.keywords.map(function(keyword){return String(keyword).trim().toLowerCase()}).filter(Boolean)}
result.push({id:id,title:title,description:String(item.description||"").trim(),category:category,keywords:keywords,thumbnail:String(item.thumbnail||"").trim(),videoId:videoId});
}catch(error){console.warn("Tutorial "+index+" skipped:",error.message)}
});
return result;
}
function isValidYouTubeId(id){return /^[a-zA-Z0-9_-]{6,20}$/.test(id)}
function getCategories(){
const categories=Array.from(new Set(state.tutorials.map(function(item){return item.category})));
categories.sort(function(a,b){return a.localeCompare(b)});
return categories;
}
function renderFilters(){
let html="";
html+=createFilterItem("All","📚");
html+=createFilterItem("Favorites","♥");
getCategories().forEach(function(category){html+=createFilterItem(category,"•")});
DOM.filterList.innerHTML=html;
updateFilterCount();
}
function createFilterItem(name,icon){
const selected=state.category===name;
let count=0;
if(name==="All")count=state.tutorials.length;
else if(name==="Favorites")count=getFavorites().length;
else count=state.tutorials.filter(function(item){return item.category===name}).length;
return `<button type="button" class="filter-item ${selected?"selected":""}" data-category="${escapeHTML(name)}"><span class="filter-item-left"><span class="filter-check ${name==="Favorites"?"favorite-filter":""}">${icon}</span><span>${escapeHTML(name)}</span></span><span>${count}</span></button>`;
}
function handleFilterClick(event){
const button=event.target.closest("[data-category]");
if(!button)return;
state.category=button.dataset.category;
renderFilters();
renderHome();
closeFilter();
}
function toggleFilter(){
state.filterOpen=!state.filterOpen;
DOM.filterMenu.classList.toggle("open",state.filterOpen);
DOM.filterButton.setAttribute("aria-expanded",state.filterOpen?"true":"false");
}
function closeFilter(){
if(!state.filterOpen)return;
state.filterOpen=false;
DOM.filterMenu.classList.remove("open");
DOM.filterButton.setAttribute("aria-expanded","false");
}
function updateFilterCount(){
const active=state.category!=="All";
DOM.filterButton.classList.toggle("active",active);
if(active){DOM.filterCount.textContent="1";DOM.filterCount.classList.add("show")}
else{DOM.filterCount.textContent="";DOM.filterCount.classList.remove("show")}
}
function getFilteredTutorials(){
return state.tutorials.filter(function(item){
let categoryMatch=true;
if(state.category==="Favorites")categoryMatch=isFavorite(item.id);
else if(state.category!=="All")categoryMatch=item.category===state.category;
if(!categoryMatch)return false;
if(!state.search)return true;
const query=state.search;
return textMatches(item.title,query)||textMatches(item.description,query)||textMatches(item.category,query)||item.keywords.some(function(keyword){return textMatches(keyword,query)});
});
}
function textMatches(text,query){return String(text||"").toLowerCase().includes(query)}
function renderHome(){
updateFilterCount();
const tutorials=getFilteredTutorials();
if(state.category==="Favorites")DOM.sectionTitle.textContent="Favorites";
else if(state.category==="All")DOM.sectionTitle.textContent="Tutorials";
else DOM.sectionTitle.textContent=state.category;
DOM.tutorialCount.textContent=tutorials.length+(tutorials.length===1?" tutorial":" tutorials");
if(tutorials.length===0)showFilteredEmpty();
else DOM.tutorialGrid.innerHTML=tutorials.map(createTutorialCard).join("");
renderContinue();
}
function createTutorialCard(item){
const watched=isWatched(item.id),favorite=isFavorite(item.id),image=safeImage(item.thumbnail);
let thumbnail="";
if(image){
thumbnail=`<img src="${escapeHTML(image)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden');"><div class="thumbnail-placeholder hidden">▶</div>`;
}else thumbnail=`<div class="thumbnail-placeholder">▶</div>`;
return `<article class="tutorial-card" data-tutorial-id="${escapeHTML(item.id)}"><div class="thumbnail">${thumbnail}<div class="play-overlay">▶</div><div class="category-badge">${escapeHTML(item.category)}</div><button type="button" class="favorite-card-button ${favorite?"active":""}" data-favorite-id="${escapeHTML(item.id)}" aria-label="Toggle favorite">${favorite?"♥":"♡"}</button></div><div class="tutorial-content"><h3 class="tutorial-title">${escapeHTML(item.title)}</h3><p class="tutorial-description">${escapeHTML(item.description||"Watch this useful tutorial.")}</p><div class="tutorial-meta">${watched?`<span class="watched-label">✓ Watched</span>`:""}</div><button type="button" class="watch-button">${watched?"Watch Again":"Watch Tutorial"}</button></div></article>`;
}
function handleTutorialClick(event){
const favorite=event.target.closest("[data-favorite-id]");
if(favorite){
event.stopPropagation();
toggleFavoriteById(favorite.dataset.favoriteId);
renderFilters();
renderHome();
return;
}
const card=event.target.closest("[data-tutorial-id]");
if(!card)return;
openTutorial(card.dataset.tutorialId);
}
function openTutorial(id){
const tutorial=state.tutorials.find(function(item){return item.id===id});
if(!tutorial){showToast("Tutorial not found.");return}
state.currentTutorial=tutorial;
DOM.home.style.display="none";
DOM.tutorialView.style.display="block";
DOM.pageTitle.textContent=tutorial.title;
DOM.pageCategory.textContent=tutorial.category;
DOM.title.textContent=tutorial.title;
DOM.description.textContent=tutorial.description;
loadVideo(tutorial);
updateVideoButtons();
history.pushState({},"","#tutorial/"+encodeURIComponent(tutorial.id));
window.scrollTo({top:0,behavior:"smooth"});
}
function loadVideo(tutorial){
DOM.player.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(tutorial.videoId)}?rel=0&modestbranding=1" title="${escapeHTML(tutorial.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
}
function updateVideoButtons(){
if(!state.currentTutorial)return;
const id=state.currentTutorial.id,watched=isWatched(id),favorite=isFavorite(id);
DOM.watched.textContent=watched?"✓ Watched":"✓ Mark Watched";
DOM.favorite.textContent=favorite?"♥ Favorited":"♡ Favorite";
DOM.favorite.classList.toggle("active",favorite);
}
function isWatched(id){
try{return localStorage.getItem(CONFIG.watchedPrefix+id)==="1"}catch(error){console.warn(error);return false}
}
function toggleWatched(){
if(!state.currentTutorial)return;
const id=state.currentTutorial.id;
try{
const key=CONFIG.watchedPrefix+id;
if(isWatched(id)){localStorage.removeItem(key);showToast("Marked as unwatched.")}
else{localStorage.setItem(key,"1");showToast("Tutorial marked as watched ✓")}
updateVideoButtons();
renderHome();
}catch(error){console.error(error);showToast("Could not save watch status.")}
}
function getFavorites(){
try{
const raw=localStorage.getItem(CONFIG.favoritesKey);
if(!raw)return[];
const data=JSON.parse(raw);
if(!Array.isArray(data))return[];
return data.filter(function(id){return typeof id==="string"});
}catch(error){console.warn(error);return[]}
}
function saveFavorites(favorites){
try{localStorage.setItem(CONFIG.favoritesKey,JSON.stringify(favorites));return true}
catch(error){console.error(error);showToast("Could not save favorite.");return false}
}
function isFavorite(id){return getFavorites().includes(id)}
function toggleFavoriteById(id){
const favorites=getFavorites(),index=favorites.indexOf(id);
if(index===-1){
favorites.push(id);
if(saveFavorites(favorites))showToast("Added to favorites ♥");
}else{
favorites.splice(index,1);
if(saveFavorites(favorites))showToast("Removed from favorites.");
}
}
function toggleCurrentFavorite(){
if(!state.currentTutorial)return;
toggleFavoriteById(state.currentTutorial.id);
updateVideoButtons();
renderFilters();
renderHome();
}
function renderContinue(){
const watched=state.tutorials.filter(function(item){return isWatched(item.id)}).slice(0,3);
if(watched.length===0){
DOM.continueHeader.classList.add("hidden");
DOM.continueGrid.innerHTML="";
return;
}
DOM.continueHeader.classList.remove("hidden");
DOM.continueGrid.innerHTML=watched.map(createTutorialCard).join("");
}
function showHome(){
state.currentTutorial=null;
DOM.tutorialView.style.display="none";
DOM.home.style.display="block";
if(location.hash)history.pushState({},"",location.pathname+location.search);
renderHome();
window.scrollTo({top:0,behavior:"smooth"});
}
function handleRoute(){
const hash=location.hash;
if(!hash.startsWith("#tutorial/"))return;
const id=decodeURIComponent(hash.substring("#tutorial/".length));
const tutorial=state.tutorials.find(function(item){return item.id===id});
if(!tutorial){showToast("Tutorial not found.");return}
state.currentTutorial=tutorial;
DOM.home.style.display="none";
DOM.tutorialView.style.display="block";
DOM.pageTitle.textContent=tutorial.title;
DOM.pageCategory.textContent=tutorial.category;
DOM.title.textContent=tutorial.title;
DOM.description.textContent=tutorial.description;
loadVideo(tutorial);
updateVideoButtons();
}
function loadTheme(){
try{
const savedTheme=localStorage.getItem(CONFIG.themeKey);
if(savedTheme==="dark"){
document.body.classList.add("dark");
DOM.theme.textContent="☀️";
updateThemeColor(true);
}else{
DOM.theme.textContent="🌙";
updateThemeColor(false);
}
}catch(error){console.warn("Theme loading error:",error);DOM.theme.textContent="🌙"}
}
function toggleTheme(){
const isDark=document.body.classList.toggle("dark");
DOM.theme.textContent=isDark?"☀️":"🌙";
updateThemeColor(isDark);
try{localStorage.setItem(CONFIG.themeKey,isDark?"dark":"light")}
catch(error){console.warn("Theme save error:",error)}
}
function updateThemeColor(dark){
const meta=document.querySelector('meta[name="theme-color"]');
if(!meta)return;
meta.setAttribute("content",dark?"#080b12":"#5b4ee8");
}
function safeImage(url){
if(!url)return"";
try{
const parsed=new URL(url);
if(parsed.protocol==="https:"||parsed.protocol==="http:")return parsed.href;
}catch(error){return""}
return"";
}
function showLoading(){
DOM.tutorialGrid.innerHTML=`<div class="loading"><div class="spinner"></div>Loading tutorials...</div>`;
}
function showEmpty(title,message){
DOM.tutorialGrid.innerHTML=`<div class="state"><div class="state-icon">📚</div><h3>${escapeHTML(title)}</h3><p>${escapeHTML(message)}</p></div>`;
DOM.tutorialCount.textContent="";
}
function showFilteredEmpty(){
let icon="🔍",title="No tutorials found",message="Try another search or category.";
if(state.category==="Favorites"){
icon="♥";
title="No favorite tutorials";
message="Tap the heart button on a tutorial to add it here.";
}
DOM.tutorialGrid.innerHTML=`<div class="state"><div class="state-icon">${icon}</div><h3>${title}</h3><p>${message}</p></div>`;
}
function showError(error){
DOM.tutorialGrid.innerHTML=`<div class="state"><div class="state-icon">⚠️</div><h3>Unable to load tutorials</h3><p>${escapeHTML(error&&error.message?error.message:"Something went wrong.")}</p><button id="retryButton" class="retry-button" type="button">Retry</button></div>`;
DOM.tutorialCount.textContent="";
DOM.filterList.innerHTML="";
const retry=document.getElementById("retryButton");
if(retry)retry.addEventListener("click",function(){showLoading();loadTutorials()});
}
function escapeHTML(value){
return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function showToast(message){
DOM.toast.textContent=message;
DOM.toast.classList.add("show");
if(state.toastTimer)clearTimeout(state.toastTimer);
state.toastTimer=setTimeout(function(){DOM.toast.classList.remove("show")},2200);
}
</script>
</body>
</html>
